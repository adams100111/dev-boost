# herdr — agent-aware terminal multiplexer. Managed by chezmoi (dev-boost).
# Invalid values revert to safe defaults with a startup warning; run `herdr` once
# after apply and confirm no config warnings. Docs: https://herdr.dev/docs/configuration/

[keys]
# Prefix ctrl+q (not tmux's ctrl+b): herdr swallows its prefix before the pane sees it.
# ctrl+b is Claude Code's "background this command", Vim's page-up and readline's back-char;
# ctrl+] is Claude Code's "open artifact". ctrl+q only costs zsh's rarely used push-line.
# Daily moves use the Alt chords below, so the prefix only serves the rarer actions.
prefix = "ctrl+q"
# Prefix-free Alt chords on top of every prefix binding. Plain Alt, never Ctrl+Alt: AeroSpace
# owns ctrl+alt+* on macOS (and GNOME/Ghostty take ctrl+alt+arrows). On macOS, Alt = the LEFT
# Option key (Ghostty macos-option-as-alt = left), and Ghostty's default alt+left/right
# word-jump is unbound there so these reach herdr; zsh keeps word-jump on alt+b / alt+f.
# Letter chords use only letters zsh (emacs keymap) and Claude Code leave free: e i j k m r v
# (zsh binds alt+d kill-word, alt+t transpose-words, alt+z; Claude Code binds meta+p/o/t/w).
# Arrows, matching the Linux setup: plain Alt walks the 1-D lists (tabs across, workspaces down
# the sidebar); Alt+Shift walks the 2-D pane grid in all four directions. Terminals can't tell
# left from right Alt, so either Option key works on macOS (arrows count as Alt on both sides).
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
previous_workspace = "alt+up"
next_workspace = "alt+down"
focus_pane_left = ["prefix+h", "alt+shift+left"]
focus_pane_down = ["prefix+j", "alt+shift+down"]
focus_pane_up = ["prefix+k", "alt+shift+up"]
focus_pane_right = ["prefix+l", "alt+shift+right"]
new_tab = ["prefix+c", "alt+e"]
split_vertical = ["prefix+v", "alt+v"]
split_horizontal = ["prefix+minus", "alt+shift+v"]
zoom = ["prefix+z", "alt+m"]
# herdr --remote pastes a local clipboard image into the remote pane on Ctrl+V (herdr's
# default since 0.7.1, pinned here on purpose): no terminal config binds Ctrl+V.
remote_image_paste = "ctrl+v"

[theme]
palette = "tokyo-night"    # matches the wezterm/terminal aesthetic

[ui.toast]
enabled = true
