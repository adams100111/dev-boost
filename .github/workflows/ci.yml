name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: pass + gpg for the pass integration test
        run: sudo apt-get update && sudo apt-get install -y pass
      - run: uv sync
      - name: ruff
        run: uv run ruff check
      - name: mypy --strict
        run: uv run mypy
      - name: pytest
        run: uv run pytest

  frozen-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build + smoke the frozen binary
        run: bash scripts/build-bundle.sh
      - name: Verify it runs without a Python runtime
        run: ./dist/devboost-x86_64 --version
