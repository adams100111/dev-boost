[profiles]
# `full` — the production workstation aggregate (the default install target).
# Union of the default-on profiles; opt-in/aesthetic/hardware profiles are excluded
# (gnome-aesthetics, gnome-theme, hardware-nvidia, optional-editors, optional-terminals,
# optional-agents) and the portable subsets terminal/devtools are alternative entry
# points, not part of full.
full = ["base","cli","shell","gnome","multimedia","editors","python","web","laravel",
        "dotnet","data","devops","react-native","apps","system","dev-hygiene","remote","claude","codex","pi"]
# `omarchy` — the Omarchy (Arch + Hyprland) aggregate: `full` minus the layers Omarchy
# already owns. It is deliberately NOT `full`:
#   - `gnome`      — Omarchy is Hyprland; a GNOME dconf dump and extension set have no
#                    analog, and theming belongs to `omarchy theme set`.
#   - `multimedia` — Arch ships codecs unencumbered, so the RPM Fusion / restricted-extras
#                    swaps that profile exists to perform have nothing to do here.
# Everything else is kept: the modules Omarchy already provides are verify-guarded or
# declare `provided_by`, so they report themselves as satisfied instead of reinstalling.
# This is where dev-boost earns its keep on Omarchy — the configured dev stacks
# (ddev, Aspire, Android SDK, LSP provisioning, templates) that `omarchy install dev-env`
# does not do: it installs languages, not stacks.
omarchy = ["base","cli","shell","editors","python","web","laravel","dotnet","data",
           "devops","react-native","apps","system","dev-hygiene","remote",
           "omarchy-update-hook"]
orca = ["orca-ide"]
orca-box = ["orca-ide","orca-serve"]
# macOS workstation default (`devboost install` on a Mac) — spec §2 Profiles. Linux-only
# members fall out via `families`; macOS-provided ones report provided-by-macos. M5
# appends "macos-desktop"; the Docker runtime and launchd timers report blocked until M4.
macos = ["base","cli","shell","editors","python","web","laravel","dotnet","data",
         "devops","react-native","apps","dev-hygiene","remote","claude","codex","pi"]
base = ["xcode-clt","homebrew","rosetta",
        "secrets","ssh-setup","rpmfusion","dnf-tune","fedora-third-party","flatpak",
        "coreutils","git","curl","wget","unzip","jq","htop","ripgrep","fd","fzf","tmux",
        "build-tools","mise","chezmoi","chezmoi-repo","docker","docker-build-gc",
        "pass","pass-store"]
cli  = ["eza","bat","btop","zoxide","atuin","direnv","delta","lazygit","lazydocker",
        "dust","duf","sd","yq","gh","tealdeer","tpm","tmux-persist","herdr","mosh",
        "fastfetch","claude-code","herdr-plugins","glow"]
shell = ["starship","bash-config","zsh-config","zsh-plugins","bash","ghostty",
         "nerd-fonts","dotfiles","claude-statusline","claude-notify","wl-clipboard"]
remote = ["tailscale","mosh"]
# claude — reusable Claude Code config bundle: base CLI + plugins + skills + MCP servers.
claude = ["claude-code","claude-plugins","claude-skills","claude-mcp"]
# codex — reusable OpenAI Codex CLI config bundle: base CLI + config + plugins + MCP servers + skills.
codex = ["codex-code","codex-config","codex-plugins","codex-mcp","codex-skills"]
# pi — bootstrap the operator's Pi coding-agent harness (harness-cli) and delegate config.
pi = ["pi-harness"]
brain-host = ["mosh","caddy","crossarch-build","code-server","browser-view"]
brain-tools = ["herdr","herdr-plugins"]
gnome            = ["gnome-settings","gnome-extensions","gnome-manager-apps"]
gnome-aesthetics = ["gnome-aesthetics-bundle"]
gnome-theme      = ["gnome-theme-bundle"]
multimedia       = ["ffmpeg-full","codecs","va-hwaccel","openh264","ffmpeg-ubuntu","codecs-ubuntu"]
editors          = ["zed","fresh","fresh-lsp"]
python           = ["uv","python-lsp"]
web              = ["web-runtimes","web-lsp"]
laravel          = ["ddev","ddev-remote","laravel-lsp"]
dotnet           = ["dotnet-sdk","aspire","dotnet-lsp"]
data             = ["data-services"]
devops           = ["devops-tools","devops-lsp"]
react-native     = ["web-runtimes","android-sdk","expo"]
apps             = ["obsidian","bruno","bitwarden","flameshot","localsend","vlc","gearlever","obsidian-sync"]
dev-hygiene      = ["aspire-gc"]
system           = ["snapper","snapper-dnf-hook","grub-btrfs","btrfs-assistant","btrfsmaintenance","fwupd","power-profiles-daemon","thermald","smartmontools","dnf-automatic-security","restic-backup","earlyoom","swapfile","gpu-detect"]
hardware-nvidia  = ["nvidia-akmod","cuda","libva-nvidia-driver","secureboot-mok","nvidia-resign-service","nvidia-container-toolkit","nvidia-driver-ubuntu"]
optional-editors = ["neovim","jetbrains-toolbox","vscode"]
# optional-terminals — WezTerm (nightly), kept for people who want its multiplexer/SSH
# domains. Deprecated: Ghostty is the default terminal on every OS, herdr the multiplexer.
optional-terminals = ["wezterm"]
security-cli     = ["pass","pass-store"]   # alias — both now ship in base
optional-agents  = ["herdr-plugins"]
# `term` — alias so `devboost install term` / `get.sh -- term` match the `devboost term`
# subcommand (the tier's profile is named `terminal`; the subcommand is `term`).
term = ["terminal"]
terminal = ["coreutils","git","curl","wget","unzip","jq","mise","chezmoi",
            "ripgrep","fd","fzf","bat","eza","btop","zoxide","atuin","direnv",
            "delta","lazygit","dust","duf","sd","yq","gh","tealdeer","fastfetch",
            "tmux","fresh","starship","bash-config","zsh-config","bash","dotfiles",
            "ghostty","nerd-fonts","claude-statusline"]
devtools = ["web-runtimes","uv","python-lsp","web-lsp","dotnet-sdk","aspire",
            "dotnet-lsp","ddev","playwright"]
# server — headless-VPS hardening + ops (Ubuntu/Debian). Separate entry point, like
# terminal/devtools; not part of `full` (which is the Fedora workstation aggregate).
server = ["tailscale","server-firewall","zram","restic-b2","tmux-persist",
          "docker","docker-build-gc"]
